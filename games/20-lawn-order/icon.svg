<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- long grass, and the stripes Bessie has mown up it -->
  <rect width="64" height="64" fill="#46843a"/>
  <g fill="#5c9c42"><rect x="4" y="6" width="2" height="2"/><rect x="50" y="8" width="2" height="2"/><rect x="44" y="18" width="2" height="2"/><rect x="56" y="30" width="2" height="2"/><rect x="48" y="44" width="2" height="2"/><rect x="58" y="52" width="2" height="2"/></g>
  <rect x="0" y="0" width="12" height="64" fill="#8cc45b"/>
  <rect x="12" y="0" width="12" height="64" fill="#5c9b40"/>
  <rect x="24" y="22" width="12" height="42" fill="#8cc45b"/>
  <rect x="4" y="0" width="2" height="64" fill="#a6d86f"/><rect x="28" y="22" width="2" height="42" fill="#a6d86f"/>
  <rect x="16" y="0" width="2" height="64" fill="#4c8a37"/>
  <!-- a bed of roses -->
  <rect x="42" y="38" width="16" height="18" fill="#1f1a17"/><rect x="43" y="39" width="14" height="14" fill="#5e3c2b"/>
  <rect x="43" y="53" width="14" height="2" fill="#925f38"/>
  <rect x="45" y="41" width="3" height="3" fill="#e8624a"/><rect x="51" y="43" width="3" height="3" fill="#f6d65a"/><rect x="46" y="47" width="3" height="3" fill="#f09bbd"/><rect x="52" y="48" width="3" height="3" fill="#e8624a"/>
  <!-- Bessie, from behind, rolling up the lawn -->
  <rect x="23" y="8" width="14" height="13" fill="#1f1a17"/>
  <rect x="24" y="9" width="12" height="9" fill="#c0372e"/><rect x="24" y="9" width="12" height="2" fill="#e8624a"/>
  <rect x="27" y="12" width="6" height="4" fill="#4d5560"/><rect x="21" y="13" width="3" height="8" fill="#1f1a17"/><rect x="36" y="13" width="3" height="8" fill="#1f1a17"/>
  <rect x="24" y="18" width="12" height="3" fill="#8d97a3"/>
  <rect x="26" y="21" width="2" height="6" fill="#925f38"/><rect x="32" y="21" width="2" height="6" fill="#925f38"/>
  <rect x="25" y="27" width="10" height="2" fill="#6a3f26"/>
  <!-- clippings flying -->
  <g fill="#a6d86f"><rect x="40" y="10" width="2" height="2"/><rect x="44" y="6" width="2" height="2"/><rect x="18" y="14" width="2" height="2"/><rect x="42" y="16" width="2" height="2"/></g>
</svg>
