<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- A little lock seen from above: brick walls, a narrowboat in the chamber, the mitre gates and their white beams -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc562"/><stop offset="1" stop-color="#7fa84e"/></linearGradient>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5aa9a3"/><stop offset="1" stop-color="#2f7d7a"/></linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="#4a2f1e"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="url(#g)"/>
  <rect x="40" y="8" width="48" height="112" fill="#d8cdb4"/>
  <rect x="44" y="8" width="40" height="112" fill="#b1503a"/>
  <rect x="48" y="8" width="32" height="112" fill="url(#w)"/>
  <path d="M48 30 q8 -3 16 0 t16 0" stroke="#bfe3dc" stroke-width="2" fill="none" opacity=".7"/>
  <path d="M48 96 q8 -3 16 0 t16 0" stroke="#bfe3dc" stroke-width="2" fill="none" opacity=".7"/>
  <!-- the boat -->
  <rect x="55" y="44" width="18" height="44" rx="8" fill="#1d1d22"/>
  <rect x="57" y="50" width="14" height="30" rx="4" fill="#b8382c"/>
  <rect x="57" y="63" width="14" height="3" fill="#e3a93b"/>
  <circle cx="64" cy="55" r="2.6" fill="#f0c33c"/><circle cx="64" cy="72" r="2.6" fill="#e46aa0"/>
  <!-- the gates: a V of dark wood, white balance beams out over the banks -->
  <path d="M48 26 L64 20 L80 26" stroke="#4b3a2b" stroke-width="6" fill="none" stroke-linejoin="round"/>
  <path d="M48 104 L64 98 L80 104" stroke="#4b3a2b" stroke-width="6" fill="none" stroke-linejoin="round"/>
  <path d="M46 27 L22 33" stroke="#f6f2e8" stroke-width="5" stroke-linecap="round"/><circle cx="21" cy="33" r="3.2" fill="#1d1d1f"/>
  <path d="M82 27 L106 33" stroke="#f6f2e8" stroke-width="5" stroke-linecap="round"/><circle cx="107" cy="33" r="3.2" fill="#1d1d1f"/>
