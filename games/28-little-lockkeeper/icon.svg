  <path d="M82 105 L106 111" stroke="#f6f2e8" stroke-width="5" stroke-linecap="round"/>
  <!-- a paddle post with its red knob -->
  <rect x="30" y="58" width="6" height="12" rx="2" fill="#262628"/><circle cx="33" cy="56" r="3.2" fill="#c8372e"/>
